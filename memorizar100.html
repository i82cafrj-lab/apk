<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador de Sistema Mayor</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary: #3498db;
            --primary-hover: #2980b9;
            --accent: #e74c3c;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 550px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            color: #34495e;
        }

        .p-subtitle {
            margin-top: 0;
            color: #7f8c8d;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .config-panel {
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex: 1;
        }

        label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        select, input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            background: #fff;
            -webkit-appearance: none;
        }

        .range-inputs {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100%;
        }

        .range-inputs input {
            text-align: center;
        }

        .flashcard {
            background: var(--card-bg);
            min-height: 200px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-bottom: 20px;
            border-bottom: 5px solid var(--primary);
        }

        .stimulus {
            font-size: 3.2rem;
            font-weight: 800;
            margin: 0;
            color: #2c3e50;
        }

        .answer {
            font-size: 1.8rem;
            font-weight: 600;
            margin-top: 15px;
            color: var(--accent);
            min-height: 2.2rem;
        }

        .hidden {
            opacity: 0;
            transform: translateY(5px);
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: var(--border-radius);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
            width: 100%;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn.next-state {
            background-color: #2ecc71;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
        }

        .stats {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 15px;
        }

        .shortcuts-hint {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Entrenador Mnemotécnico</h1>
    <p class="p-subtitle">Tabla 100% Actualizada desde tu Imagen</p>

    <div class="config-panel">
        <div class="config-group">
            <label for="modeSelect">Dirección</label>
            <select id="modeSelect">
                <option value="numToWord">Número ➔ Palabra</option>
                <option value="wordToNum">Palabra ➔ Número</option>
            </select>
        </div>

        <div class="config-group">
            <label>Rango</label>
            <div class="range-inputs">
                <input type="number" id="minRange" value="0" min="0" max="100">
                <input type="number" id="maxRange" value="10" min="0" max="100">
            </div>
        </div>
    </div>

    <div class="flashcard">
        <div id="stimulusDisplay" class="stimulus">-</div>
        <div id="answerDisplay" class="answer hidden">-</div>
    </div>

    <button id="mainButton" class="action-btn">Mostrar Respuesta</button>

    <div class="stats">Tarjetas vistas: <span id="counterDisplay">0</span></div>
    <div class="shortcuts-hint">Optimizado para pantallas táctiles de móvil y teclado.</div>
</div>

<script>
    // Tu tabla exacta extraída de la imagen
    const mnemotecnica = {
        0: "Aro, rey, oro", 1: "Te, Día", 2: "Noe, Ñu", 3: "Amo", 4: "Oca", 5: "Ola, Olla", 
        6: "Oso", 7: "Fe/Uva/Eje", 8: "Hacha", 9: "Buho, Ave, Pío", 10: "Toro", 
        11: "Dado", 12: "Duna", 13: "Dama", 14: "Taco", 15: "Tela", 16: "Tasa", 
        17: "Tufo", 18: "Techo", 19: "Tubo", 20: "Noria", 21: "Nota", 22: "Nene", 
        23: "Nemo", 24: "Nuca", 25: "Nilo", 26: "Nasa", 27: "Nave", 28: "Noche", 
        29: "Nube", 30: "Mar", 31: "Moto", 32: "Mono", 33: "Momia", 34: "Momo", 
        35: "Mula", 36: "Mesa", 37: "Mafia", 38: "Mecha", 39: "Mapa", 40: "Cara", 
        41: "Cata", 42: "Cuna", 43: "Cama", 44: "CoCo", 45: "Cola", 46: "Casa", 
        47: "Cava", 48: "Coche", 49: "Cubo", 50: "Loro", 51: "Lata", 52: "Luna", 
        53: "Lima", 54: "Loco", 55: "Lala (Teletubbie Amarillo)", 56: "Losa", 57: "Lujo", 
        58: "Leche", 59: "Lobo", 60: "Sera", 61: "Seta", 62: "Saña", 63: "Suma", 
        64: "Saco", 65: "Sala", 66: "Seso", 67: "Sofa", 68: "Suchi (Sushi)", 69: "Sapo", 
        70: "Faro", 71: "Foto", 72: "Fino", 73: "Fama", 74: "Foca", 75: "Falo", 
        76: "Foso", 77: "Fofo", 78: "Fecha", 79: "Fiba", 80: "Churro", 81: "Chita", 
        82: "Chino", 83: "Chimo", 84: "Chico", 85: "Cholo", 86: "Chosa (Choza)", 
        87: "Chufa", 88: "Chucho", 89: "Chapa", 90: "Pera", 91: "Pata", 92: "Pino", 
        93: "Puma", 94: "Pico", 95: "Pelo", 96: "Peso", 97: "Pavo", 98: "Pecho", 
        99: "Pipa", 100: "Torero"
    };

    let currentNumber = null;
    let isShowingAnswer = false;
    let cardsViewed = 0;

    const stimulusDisplay = document.getElementById('stimulusDisplay');
    const answerDisplay = document.getElementById('answerDisplay');
    const mainButton = document.getElementById('mainButton');
    const modeSelect = document.getElementById('modeSelect');
    const minRangeInput = document.getElementById('minRange');
    const maxRangeInput = document.getElementById('maxRange');
    const counterDisplay = document.getElementById('counterDisplay');

    function nextCard() {
        const mode = modeSelect.value;
        let min = parseInt(minRangeInput.value) || 0;
        let max = parseInt(maxRangeInput.value) || 100;

        if (min < 0) min = 0;
        if (max > 100) max = 100;
        if (min > max) { let temp = min; min = max; max = temp; minRangeInput.value = min; maxRangeInput.value = max; }

        const range = max - min + 1;
        currentNumber = Math.floor(Math.random() * range) + min;

        if (mode === "numToWord") {
            stimulusDisplay.textContent = currentNumber;
            answerDisplay.textContent = mnemotecnica[currentNumber];
        } else {
            stimulusDisplay.textContent = mnemotecnica[currentNumber];
            answerDisplay.textContent = currentNumber;
        }

        answerDisplay.classList.add('hidden');
        mainButton.textContent = "Mostrar Respuesta";
        mainButton.classList.remove('next-state');
        isShowingAnswer = false;
    }

    function handleAdvance() {
        if (!isShowingAnswer) {
            answerDisplay.classList.remove('hidden');
            mainButton.textContent = "Siguiente ➔";
            mainButton.classList.add('next-state');
            isShowingAnswer = true;
        } else {
            cardsViewed++;
            counterDisplay.textContent = cardsViewed;
            nextCard();
        }
    }

    mainButton.addEventListener('click', handleAdvance);
    modeSelect.addEventListener('change', () => { cardsViewed = 0; counterDisplay.textContent = "0"; nextCard(); });
    minRangeInput.addEventListener('change', nextCard);
    maxRangeInput.addEventListener('change', nextCard);

    window.addEventListener('keydown', (e) => {
        if (e.code === "Space" || e.code === "Enter") {
            if (document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                handleAdvance();
            }
        }
    });

    nextCard();
</script>

</body>
</html>
